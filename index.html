<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3294172390463223"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Classroom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="lunar.png">

  <style>
    :root {
      --bg: #08080c;
      --text: #f4f4f7;
      --muted: #8b8b99;
      --line: rgba(255, 255, 255, 0.09);
      --accent: #38bdf8;
      --accent-2: #a855f7;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 60% 45% at 50% 0%, rgba(56, 189, 248, 0.10), transparent 70%),
        var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
      text-align: center;
    }

    /* Background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .aurora {
      position: absolute;
      width: 55vmax;
      height: 55vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.28;
      animation: drift 22s ease-in-out infinite alternate;
    }

    .aurora.a { background: #38bdf8; top: -25vmax; left: -15vmax; }
    .aurora.b { background: #a855f7; bottom: -28vmax; right: -18vmax; animation-duration: 28s; animation-direction: alternate-reverse; }
    .aurora.c { background: #6366f1; top: 30%; left: 40%; width: 35vmax; height: 35vmax; opacity: 0.16; animation-duration: 34s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(8vmax, 6vmax) scale(1.18); }
    }

    #net { position: absolute; inset: 0; width: 100%; height: 100%; }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(8, 8, 12, 0.75) 100%);
    }

    footer { z-index: 1; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .brand img { width: 28px; height: 28px; border-radius: 8px; }

    h1 {
      margin: 0;
      font-weight: 700;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    h1 em {
      display: block;
      font-style: italic;
      font-weight: 600;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lede {
      margin: 18px 0 34px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    /* Tabs */
    .tabs {
      display: inline-flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      margin-bottom: 26px;
      max-width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab {
      position: relative;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 999px;
      padding: 9px 18px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }

    .tab:hover { color: var(--text); }

    .tab[aria-selected="true"] {
      color: #05070a;
      background: var(--text);
    }

    .badge {
      margin-left: 8px;
      padding: 2px 7px;
      font-size: 0.65rem;
      font-weight: 700;
      border-radius: 999px;
      color: #05070a;
      background: var(--accent);
    }

    .launch {
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #05070a;
      background: var(--text);
      border: 0;
      border-radius: 14px;
      padding: 15px 44px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .launch:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(56, 189, 248, 0.25); }
    .launch:active { transform: scale(0.97); }

    .hint {
      margin: 16px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    kbd {
      font-family: inherit;
      font-size: 0.75rem;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }

    footer {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0));
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.7;
    }

    .tab:focus-visible, .launch:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="aurora a"></div>
    <div class="aurora b"></div>
    <div class="aurora c"></div>
    <canvas id="net"></canvas>
    <div class="vignette"></div>
  </div>

  <div class="brand">
    <img src="lunar.png" alt="">
    <span>Tide Inc</span>
  </div>

  <h1>Welcome To Tide Launcher.<em>Choice Any Of Our Sites</em></h1>
  <p class="lede"></p>

  <div class="tabs" role="tablist" aria-label="What to launch">
    <button class="tab" role="tab" aria-selected="true"  data-target="tide">Tide</button>
    <button class="tab" role="tab" aria-selected="false" data-target="lunar">Lunar</button>
    <button class="tab" role="tab" aria-selected="false" data-target="bo1">Black Ops 1 Zombies<span class="badge">NEW!</span></button>
  </div>

  <div>
    <button class="launch" id="launchBtn">Launch</button>
  </div>
  <p class="hint" id="hint"></p>

  <footer>© Tide Inc · v2.0</footer>

  <script>
    /* ---------- Destinations ---------- */

    // Put the address of your Black Ops 1 Zombies page here.
    const BLACK_OPS_URL = "";

    const TARGETS = {
      tide:  { url: "https://mathmaticsandixl.vercel.app/", cloak: false, hint: "Opens the library in a new window" },
      lunar: { url: "https://lunarr-os.vercel.app/app.html", cloak: true,  hint: "Opens the Lunar OS interface in a new window" },
      bo1:   { url: BLACK_OPS_URL, cloak: false, hint: "Opens Black Ops 1 Zombies in a new window" }
    };

    let current = "tide";

    /* ---------- Tabs ---------- */

    const tabs = document.querySelectorAll(".tab");
    const hint = document.getElementById("hint");

    function renderHint() {
      hint.innerHTML = TARGETS[current].hint + " · or press <kbd>Enter</kbd>";
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        current = tab.dataset.target;
        tabs.forEach(t => t.setAttribute("aria-selected", String(t === tab)));
        renderHint();
      });
    });

    /* ---------- Launching ---------- */

    function openCloaked(url) {
      const win = window.open();
      if (!win) return false;

      win.document.title = "Lunar";
      const b = win.document.body.style;
      b.margin = "0";
      b.height = "100vh";
      b.overflow = "hidden";
      b.background = "#030005";

      const iframe = win.document.createElement("iframe");
      iframe.style.cssText = "width:100%;height:100%;border:none";
      iframe.src = url;
      win.document.body.appendChild(iframe);
      return true;
    }

    function launch() {
      const t = TARGETS[current];

      if (!t.url) {
        hint.textContent = "This tab has no address yet. Set BLACK_OPS_URL in the page script.";
        return;
      }

      const ok = t.cloak ? openCloaked(t.url) : !!window.open(t.url, "_blank");
      if (!ok) alert("Pop-up blocked! Please allow pop-ups to launch.");
    }

    document.getElementById("launchBtn").addEventListener("click", launch);

    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && document.activeElement.tagName !== "BUTTON") launch();
    });

    renderHint();

    /* ---------- Background: drifting particle network ---------- */

    (function () {
      const canvas = document.getElementById("net");
      const ctx = canvas.getContext("2d");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const mouse = { x: -9999, y: -9999 };
      let w, h, dpr, pts = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = canvas.clientWidth;
        h = canvas.clientHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.min(90, Math.floor((w * h) / 14000));
        pts = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.4 + 0.6
        }));
      }

      function frame() {
        ctx.clearRect(0, 0, w, h);
        const link = 130;

        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          if (!reduce) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(200, 225, 255, 0.7)";
          ctx.fill();

          for (let j = i + 1; j < pts.length; j++) {
            const q = pts[j];
            const d = Math.hypot(p.x - q.x, p.y - q.y);
            if (d < link) {
              ctx.strokeStyle = "rgba(125, 190, 255," + (0.16 * (1 - d / link)) + ")";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.stroke();
            }
          }

          const md = Math.hypot(p.x - mouse.x, p.y - mouse.y);
          if (md < 160) {
            ctx.strokeStyle = "rgba(168, 85, 247," + (0.35 * (1 - md / 160)) + ")";
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        }

        if (!reduce) requestAnimationFrame(frame);
      }

      window.addEventListener("resize", () => { resize(); if (reduce) frame(); });
      window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
      window.addEventListener("mouseleave", () => { mouse.x = mouse.y = -9999; });

      resize();
      frame();
    })();
  </script>
</body>
</html>
