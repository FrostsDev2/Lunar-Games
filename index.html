<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3294172390463223"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lunar Launcher</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="lunar.png">

  <style>
    :root {
      --primary: #a855f7;
      --accent: #6366f1;
      --tide: #38bdf8;
      --bg-dark: #030005;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at center, #0f001a 0%, #030005 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }

    /* Background visuals */
    .visuals {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .drop {
      position: absolute;
      width: 1px;
      height: 40px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(168, 85, 247, 0.4)
      );
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
      }
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--d) infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.2;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.3);
      }
    }

    /* Main card */
    .container {
      position: relative;
      z-index: 10;
      width: min(520px, 90vw);
      text-align: center;
      padding: 45px 40px;
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.01);
    }

    .logo-main {
      width: 115px;
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
      margin-bottom: 18px;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-12px) rotate(2deg);
      }
    }

    h1 {
      font-weight: 900;
      font-size: 3.5rem;
      margin: 0 0 8px 0;
      letter-spacing: -2px;
      background: linear-gradient(
        135deg,
        #fff 30%,
        var(--primary) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .subtitle {
      opacity: 0.5;
      font-weight: 400;
      margin: 0 0 30px 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    /* Launcher choices */
    .launch-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .launch-button {
      width: 100%;
      border: none;
      padding: 18px 22px;
      font-family: 'Poppins', sans-serif;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .launch-button:active {
      transform: scale(0.97);
    }

    /* Tide button */
    .tide-button {
      background: linear-gradient(
        135deg,
        rgba(56, 189, 248, 0.2),
        rgba(14, 165, 233, 0.08)
      );
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: white;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.08);
    }

    .tide-button:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.7);
      background: linear-gradient(
        135deg,
        rgba(56, 189, 248, 0.3),
        rgba(14, 165, 233, 0.12)
      );
      box-shadow: 0 15px 40px rgba(56, 189, 248, 0.2);
    }

    /* Lunar button */
    .lunar-button {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(168, 85, 247, 0.25);
      color: white;
    }

    .lunar-button:hover {
      transform: translateY(-3px);
      border-color: rgba(168, 85, 247, 0.6);
      background: rgba(168, 85, 247, 0.12);
      box-shadow: 0 15px 40px rgba(168, 85, 247, 0.2);
    }

    .button-title {
      display: block;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.3px;
      margin-bottom: 3px;
    }

    .button-description {
      display: block;
      font-size: 11px;
      font-weight: 400;
      opacity: 0.55;
      letter-spacing: 0.2px;
    }

    .new-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
    }

    /* Background watermark */
    .bg-logo {
      position: fixed;
      width: 70vw;
      opacity: 0.02;
      z-index: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Small screens */
    @media (max-width: 500px) {
      .container {
        padding: 35px 25px;
      }

      h1 {
        font-size: 3rem;
      }

      .logo-main {
        width: 95px;
      }
    }
  </style>

  <script>
    function openLunar() {
      const win = window.open();

      if (!win) {
        alert("Pop-up blocked! Please allow pop-ups to launch Lunar.");
        return;
      }

      const url = "https://lunarr-os.vercel.app/app.html";

      const iframe = win.document.createElement("iframe");

      win.document.title = "Lunar";
      win.document.body.style.margin = "0";
      win.document.body.style.padding = "0";
      win.document.body.style.height = "100vh";
      win.document.body.style.overflow = "hidden";
      win.document.body.style.background = "#030005";

      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.style.border = "none";
      iframe.src = url;

      win.document.body.appendChild(iframe);
    }

    function openTide() {
      window.location.href =
        "https://tideeducationallessons.vercel.app/";
    }

    window.onload = function() {
      const visuals = document.querySelector(".visuals");

      /* Generate Stars */
      for (let i = 0; i < 100; i++) {
        const star = document.createElement("div");

        star.className = "star";

        const size = Math.random() * 2;

        star.style.width = size + "px";
        star.style.height = size + "px";
        star.style.left = Math.random() * 100 + "vw";
        star.style.top = Math.random() * 100 + "vh";

        star.style.setProperty(
          "--d",
          (3 + Math.random() * 4) + "s"
        );

        visuals.appendChild(star);
      }

      /* Generate Rain */
      for (let i = 0; i < 60; i++) {
        const drop = document.createElement("div");

        drop.className = "drop";

        drop.style.left = Math.random() * 100 + "vw";
        drop.style.top = "-50px";

        drop.style.animationDuration =
          (0.7 + Math.random() * 0.5) + "s";

        drop.style.animationDelay =
          Math.random() * 2 + "s";

        drop.style.opacity =
          Math.random() * 0.5;

        visuals.appendChild(drop);
      }
    };
  </script>
</head>

<body>

  <img src="lunar.png" class="bg-logo" alt="">

  <div class="visuals"></div>

  <div class="container">

    <img
      src="lunar.png"
      class="logo-main"
      alt="Lunar Logo"
    >

    <h1>Lunar</h1>

    <p class="subtitle">
      Secure OS Interface
    </p>

    <div class="launch-options">

      <!-- NEW TIDE -->
      <button
        class="launch-button tide-button"
        onclick="openTide()"
      >
        <span class="new-badge">NEW</span>

        <span class="button-title">
          🌊 NEW TIDE!
        </span>

        <span class="button-description">
          Launch Update Tide Site!
        </span>
      </button>

      <!-- LUNAR -->
      <button
        class="launch-button lunar-button"
        onclick="openLunar()"
      >
        <span class="button-title">
          🌙 Launch Lunar
        </span>

        <span class="button-description">
          Continue to the Lunar OS interface
        </span>
      </button>

    </div>

  </div>

</body>
</html>
