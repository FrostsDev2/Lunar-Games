<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Launcher</title>

<!-- Modern Chill Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;900&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="lunar.png">

<style>
  :root {
    --primary: #a855f7;
    --accent: #6366f1;
    --bg-dark: #030005;
  }

  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-dark);
    /* Deep space gradient */
    background: radial-gradient(circle at center, #0f001a 0%, #030005 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
  }

  /* Layers Container */
  .visuals {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* Rain Styling */
  .drop {
    position: absolute;
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, transparent, rgba(168, 85, 247, 0.4));
    animation: fall linear infinite;
  }

  @keyframes fall {
    to { transform: translateY(100vh); }
  }

  /* Star Styling */
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.3); }
  }

  /* Main UI Card */
  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 50px;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 40px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.8);
    transition: transform 0.3s ease;
  }

  .container:hover {
    transform: scale(1.01);
  }

  .logo-main {
    width: 130px;
    filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
    margin-bottom: 20px;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(2deg); }
  }

  /* Chill but Bold Text */
  h1 {
    font-weight: 900;
    font-size: 3.5rem;
    margin: 0 0 10px 0;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
  }

  p {
    opacity: 0.5;
    font-weight: 400;
    margin-bottom: 35px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 0.8rem;
  }

  /* The Button */
  button {
    background: white;
    border: none;
    padding: 18px 40px;
    color: #000;
    font-family: 'Poppins', sans-serif;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 0.5px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
  }

  button:hover {
    background: var(--primary);
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5);
  }

  button:active {
    transform: scale(0.96);
  }

  /* Subtle background watermark */
  .bg-logo {
    position: fixed;
    width: 70vw;
    opacity: 0.02;
    z-index: 0;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
</style>

<script>
  function openSite() {
    const win = window.open();
    if (!win) {
      alert("Pop-up blocked! Please allow pop-ups to launch.");
      return;
    }
    const url = "https://lunarr-os.vercel.app/app.html";
    const iframe = win.document.createElement('iframe');
    
    win.document.body.style.margin = "0";
    win.document.body.style.padding = "0";
    win.document.body.style.height = "100vh";
    win.document.body.style.overflow = "hidden";
    
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";
    iframe.src = url;

    win.document.body.appendChild(iframe);
  }

  window.onload = function() {
    const visuals = document.querySelector('.visuals');

    // Generate Stars
    for (let i = 0; i < 100; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + "vw";
      star.style.top = Math.random() * 100 + "vh";
      star.style.setProperty('--d', (3 + Math.random() * 4) + 's');
      visuals.appendChild(star);
    }

    // Generate Rain
    for (let i = 0; i < 60; i++) {
      let drop = document.createElement('div');
      drop.className = 'drop';
      drop.style.left = Math.random() * 100 + "vw";
      drop.style.top = "-50px";
      drop.style.animationDuration = (0.7 + Math.random() * 0.5) + "s";
      drop.style.animationDelay = Math.random() * 2 + "s";
      drop.style.opacity = Math.random() * 0.5;
      visuals.appendChild(drop);
    }
  }
</script>
</head>

<body>

<img src="lunar.png" class="bg-logo" alt="">

<!-- Particles and Rain Layer -->
<div class="visuals"></div>

<div class="container">
  <img src="lunar.png" class="logo-main" alt="Lunar Logo">
  <h1>Lunar</h1>
  <p>Secure OS Interface</p>
  <button onclick="openSite()">LAUNCH STEALTH MODE</button>
</div>

</body>
</html>
