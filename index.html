<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lunar Games - Offline</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 2.5rem;
      color: #c084fc;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #e2e8f0;
    }

    .emoji {
      font-size: 1.5rem;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🌙 Lunar Games</h1>

    <p>
      Sorry! Lunar Games is down for updates and stuff.
      <br><br>
      Idk why it’s down tbh, that’s what the developers told me
      <span class="emoji">🤷‍♂️</span>
      <br><br>
      Sorry.
    </p>

    <div class="footer">
      Please check back later.
    </div>
  </div>

</body>
</html>
