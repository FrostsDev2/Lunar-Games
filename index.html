<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3294172390463223"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Classroom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="lunar.png">

  <style>
    :root {
      --bg: #08080c;
      --text: #f4f4f7;
      --muted: #8b8b99;
      --line: rgba(255, 255, 255, 0.09);
      --accent: #38bdf8;
      --accent-2: #a855f7;
      --mx: 50%;
      --my: 50%;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 60% 45% at 50% 0%, rgba(56, 189, 248, 0.10), transparent 70%),
        var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0) 20px env(safe-area-inset-bottom, 0);
      text-align: center;
      overflow-x: hidden;
    }

    /* ---------- Background ---------- */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }

    .aurora {
      position: absolute;
      width: 55vmax; height: 55vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.28;
      animation: drift 22s ease-in-out infinite alternate;
    }
    .aurora.a { background: #38bdf8; top: -25vmax; left: -15vmax; }
    .aurora.b { background: #a855f7; bottom: -28vmax; right: -18vmax; animation-duration: 28s; animation-direction: alternate-reverse; }
    .aurora.c { background: #6366f1; top: 30%; left: 40%; width: 35vmax; height: 35vmax; opacity: 0.16; animation-duration: 34s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(8vmax, 6vmax) scale(1.18); }
    }

    #net { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Soft light that follows the cursor */
    .spot {
      position: absolute; inset: 0;
      background: radial-gradient(420px circle at var(--mx) var(--my), rgba(56, 189, 248, 0.10), transparent 65%);
    }

    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(8, 8, 12, 0.75) 100%);
    }

    /* ---------- Card ---------- */
    .card {
      position: relative;
      width: min(560px, 100%);
      padding: 40px 28px 34px;
      border-radius: 28px;
      background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both;
    }

    /* Rotating gradient edge */
    .card::before {
      content: "";
      position: absolute; inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(from var(--ang, 0deg), transparent 0 70%, var(--accent) 85%, var(--accent-2) 95%, transparent 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      mask-composite: exclude;
      opacity: 0.75;
      animation: spin 7s linear infinite;
      pointer-events: none;
    }

    @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    @keyframes spin { to { --ang: 360deg; } }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(0.98); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: none; }
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--muted);
      padding: 6px 14px 6px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      margin-bottom: 28px;
    }
    .brand img { width: 24px; height: 24px; border-radius: 7px; }

    h1 {
      margin: 0;
      font-weight: 700;
      font-size: clamp(2rem, 7vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    h1 em {
      display: block;
      margin-top: 4px;
      font-style: italic;
      font-weight: 600;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: flow 6s linear infinite;
    }
    @keyframes flow { to { background-position: 200% 0; } }

    .lede { margin: 14px 0 30px; color: var(--muted); font-size: 0.98rem; }

    /* ---------- Tabs ---------- */
    .tabs {
      position: relative;
      display: inline-flex;
      gap: 4px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
      margin-bottom: 26px;
      max-width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Sliding highlight */
    .pill {
      position: absolute;
      border-radius: 999px;
      background: var(--text);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.28);
      transition: left .35s cubic-bezier(.3,1.3,.5,1), top .35s cubic-bezier(.3,1.3,.5,1), width .35s cubic-bezier(.3,1.3,.5,1), height .35s ease;
      pointer-events: none;
    }

    .tab {
      position: relative;
      z-index: 1;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 999px;
      padding: 9px 18px;
      cursor: pointer;
      transition: color 0.25s;
    }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { color: #05070a; }

    .badge {
      margin-left: 8px;
      padding: 2px 7px;
      font-size: 0.62rem;
      font-weight: 700;
      border-radius: 999px;
      color: #05070a;
      background: var(--accent);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.55); }
      50%      { box-shadow: 0 0 0 6px rgba(56, 189, 248, 0); }
    }

    /* ---------- Launch button ---------- */
    .launch {
      position: relative;
      overflow: hidden;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #05070a;
      background: var(--text);
      border: 0;
      border-radius: 16px;
      padding: 15px 52px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.25s;
    }
    .launch::after {
      content: "";
      position: absolute; top: 0; left: -80%;
      width: 50%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(56, 189, 248, 0.45), transparent);
      transform: skewX(-20deg);
      transition: left 0.7s ease;
    }
    .launch:hover { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(56, 189, 248, 0.32); }
    .launch:hover::after { left: 130%; }
    .launch:active { transform: scale(0.96); }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.45);
      transform: scale(0);
      animation: ripple 0.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }

    .hint { margin: 18px 0 0; font-size: 0.8rem; color: var(--muted); min-height: 1.2em; transition: opacity .2s; }
    .hint.swap { opacity: 0; }

    kbd {
      font-family: inherit;
      font-size: 0.72rem;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 20px);
      max-width: calc(100% - 40px);
      padding: 12px 20px;
      font-size: 0.85rem;
      border-radius: 14px;
      background: rgba(20, 20, 28, 0.9);
      border: 1px solid rgba(168, 85, 247, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s, transform .3s;
      z-index: 5;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    footer {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.7;
    }

    .tab:focus-visible, .launch:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    @media (max-width: 420px) {
      .card { padding: 32px 18px 28px; border-radius: 24px; }
      .tab { padding: 8px 14px; }
      .launch { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="aurora a"></div>
    <div class="aurora b"></div>
    <div class="aurora c"></div>
    <canvas id="net"></canvas>
    <div class="spot"></div>
    <div class="vignette"></div>
  </div>

  <main class="card" id="card">
    <div class="brand">
      <img src="lunar.png" alt="">
      <span>Tide Inc</span>
    </div>

    <h1>Welcome To Tide Launcher.<em>Choose Any Of Our Sites</em></h1>
    <p class="lede">Pick a destination, then hit launch.</p>

    <div class="tabs" id="tabs" role="tablist" aria-label="What to launch">
      <span class="pill" id="pill" aria-hidden="true"></span>
      <button class="tab" role="tab" aria-selected="true"  data-target="tide">Tide</button>
      <button class="tab" role="tab" aria-selected="false" data-target="lunar">Lunar</button>
      <button class="tab" role="tab" aria-selected="false" data-target="bo1">Black Ops 1 Zombies<span class="badge">NEW!</span></button>
    </div>

    <div>
      <button class="launch" id="launchBtn">Launch</button>
    </div>
    <p class="hint" id="hint"></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer>© Tide Inc · v2.1</footer>

  <script>
    /* ---------- Destinations ---------- */

    const BLACK_OPS_URL = "https://savetheturtles.vercel.app";

    const TARGETS = {
      tide:  { url: "https://mathmaticsandixl.vercel.app/", cloak: false, hint: "Opens the library in a new window" },
      lunar: { url: "https://lunarr-os.vercel.app/app.html", cloak: true, title: "Lunar", hint: "Opens the Lunar OS interface in a new window" },
      bo1:   { url: BLACK_OPS_URL, cloak: true, title: "Black Ops 1 Zombies", hint: "Opens Black Ops 1 Zombies in a new window" }
    };

    let current = "tide";

    /* ---------- Tabs ---------- */

    const tabs = Array.from(document.querySelectorAll(".tab"));
    const pill = document.getElementById("pill");
    const hint = document.getElementById("hint");
    const toast = document.getElementById("toast");

    function movePill() {
      const active = tabs.find(t => t.getAttribute("aria-selected") === "true");
      if (!active) return;
      pill.style.left = active.offsetLeft + "px";
      pill.style.top = active.offsetTop + "px";
      pill.style.width = active.offsetWidth + "px";
      pill.style.height = active.offsetHeight + "px";
    }

    function renderHint(animate) {
      const html = TARGETS[current].hint + " · or press <kbd>Enter</kbd>";
      if (!animate) { hint.innerHTML = html; return; }
      hint.classList.add("swap");
      setTimeout(() => { hint.innerHTML = html; hint.classList.remove("swap"); }, 160);
    }

    function select(tab) {
      current = tab.dataset.target;
      tabs.forEach(t => {
        const on = t === tab;
        t.setAttribute("aria-selected", String(on));
        t.tabIndex = on ? 0 : -1;
      });
      movePill();
      renderHint(true);
    }

    tabs.forEach((tab, i) => {
      tab.tabIndex = i === 0 ? 0 : -1;
      tab.addEventListener("click", () => select(tab));
      tab.addEventListener("keydown", e => {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        e.preventDefault();
        const dir = e.key === "ArrowRight" ? 1 : -1;
        const next = tabs[(i + dir + tabs.length) % tabs.length];
        select(next);
        next.focus();
      });
    });

    window.addEventListener("resize", movePill);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(movePill);

    /* ---------- Toast ---------- */

    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
    }

    /* ---------- Launching ---------- */

    function openCloaked(url, title) {
      const win = window.open();
      if (!win) return false;

      win.document.title = title || "Classroom";
      const b = win.document.body.style;
      b.margin = "0";
      b.height = "100vh";
      b.overflow = "hidden";
      b.background = "#030005";

      const iframe = win.document.createElement("iframe");
      iframe.style.cssText = "width:100%;height:100%;border:none";
      iframe.src = url;
      win.document.body.appendChild(iframe);
      return true;
    }

    function launch() {
      const t = TARGETS[current];

      if (!t.url) {
        showToast("This tab has no address yet.");
        return;
      }

      const ok = t.cloak ? openCloaked(t.url, t.title) : !!window.open(t.url, "_blank");
      if (!ok) showToast("Pop-up blocked. Allow pop-ups for this site, then try again.");
    }

    const launchBtn = document.getElementById("launchBtn");

    launchBtn.addEventListener("click", e => {
      const r = launchBtn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const dot = document.createElement("span");
      dot.className = "ripple";
      dot.style.width = dot.style.height = size + "px";
      dot.style.left = (e.clientX - r.left - size / 2) + "px";
      dot.style.top = (e.clientY - r.top - size / 2) + "px";
      launchBtn.appendChild(dot);
      setTimeout(() => dot.remove(), 650);
      launch();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && document.activeElement.tagName !== "BUTTON") launch();
    });

    renderHint(false);
    movePill();

    /* ---------- Cursor glow + subtle card tilt ---------- */

    const card = document.getElementById("card");
    const finePointer = window.matchMedia("(pointer: fine)").matches;
    const noMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    window.addEventListener("mousemove", e => {
      document.documentElement.style.setProperty("--mx", e.clientX + "px");
      document.documentElement.style.setProperty("--my", e.clientY + "px");

      if (finePointer && !noMotion) {
        const r = card.getBoundingClientRect();
        const px = (e.clientX - (r.left + r.width / 2)) / window.innerWidth;
        const py = (e.clientY - (r.top + r.height / 2)) / window.innerHeight;
        card.style.transform = "perspective(900px) rotateY(" + (px * 6) + "deg) rotateX(" + (-py * 6) + "deg)";
      }
    });

    /* ---------- Background: drifting particle network ---------- */

    (function () {
      const canvas = document.getElementById("net");
      const ctx = canvas.getContext("2d");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const mouse = { x: -9999, y: -9999 };
      let w, h, dpr, pts = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = canvas.clientWidth;
        h = canvas.clientHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.min(90, Math.floor((w * h) / 14000));
        pts = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.4 + 0.6
        }));
      }

      function frame() {
        ctx.clearRect(0, 0, w, h);
        const link = 130;

        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          if (!reduce) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(200, 225, 255, 0.7)";
          ctx.fill();

          for (let j = i + 1; j < pts.length; j++) {
            const q = pts[j];
            const d = Math.hypot(p.x - q.x, p.y - q.y);
            if (d < link) {
              ctx.strokeStyle = "rgba(125, 190, 255," + (0.16 * (1 - d / link)) + ")";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.stroke();
            }
          }

          const md = Math.hypot(p.x - mouse.x, p.y - mouse.y);
          if (md < 160) {
            ctx.strokeStyle = "rgba(168, 85, 247," + (0.35 * (1 - md / 160)) + ")";
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        }

        if (!reduce) requestAnimationFrame(frame);
      }

      window.addEventListener("resize", () => { resize(); if (reduce) frame(); });
      window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
      window.addEventListener("mouseleave", () => { mouse.x = mouse.y = -9999; });

      resize();
      frame();
    })();
  </script>
</body>
</html>
