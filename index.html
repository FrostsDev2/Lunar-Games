<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lunar Launcher</title>

<!-- Tab icon -->
<link rel="icon" type="image/png" href="lunar.png">

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #000000, #1a0026);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  /* Faint background logo */
  .bg-logo {
    position: fixed;
    width: 600px;
    opacity: 0.06;
    z-index: 0;
    pointer-events: none;
    filter: blur(0.5px);
  }

  .container {
    text-align: center;
    z-index: 2;
  }

  img {
    width: 150px;
    margin-bottom: 20px;
  }

  button {
    background: #6a00ff;
    border: none;
    padding: 15px 30px;
    color: white;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: 0.2s;
  }

  button:hover {
    transform: scale(1.05);
  }

  /* Mouse-follow glow */
  button::before {
    content: "";
    position: absolute;
    width: 160px;
    height: 160px;
    background: radial-gradient(circle, rgba(138,44,255,0.6) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    top: var(--y, 50%);
    left: var(--x, 50%);
    transition: top 0.05s linear, left 0.05s linear;
  }

  /* Ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transform: scale(0);
    animation: rippleAnim 0.6s linear;
    pointer-events: none;
  }

  @keyframes rippleAnim {
    to {
      transform: scale(4);
      opacity: 0;
    }
  }

  /* Rain */
  .rain {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 1;
  }

  .drop {
    position: absolute;
    width: 2px;
    height: 15px;
    background: rgba(200, 200, 255, 0.3);
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-100vh); }
    100% { transform: translateY(100vh); }
  }
</style>

<script>
  function openSite() {
    var win = window.open();
    var url = "https://lunarr-os.vercel.app/app.html";

    var iframe = win.document.createElement('iframe');
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";
    iframe.style.position = "fixed";
    iframe.style.top = "0";
    iframe.style.left = "0";
    iframe.src = url;

    win.document.body.appendChild(iframe);
  }

  window.onload = function() {
    const rainContainer = document.querySelector('.rain');
    const button = document.querySelector('button');

    // Rain
    for (let i = 0; i < 150; i++) {
      let drop = document.createElement('div');
      drop.classList.add('drop');
      drop.style.left = Math.random() * 100 + "vw";
      drop.style.animationDuration = (0.5 + Math.random()) + "s";
      drop.style.opacity = Math.random();
      rainContainer.appendChild(drop);
    }

    // Mouse glow follow
    button.addEventListener('mousemove', e => {
      const rect = button.getBoundingClientRect();
      button.style.setProperty('--x', (e.clientX - rect.left) + 'px');
      button.style.setProperty('--y', (e.clientY - rect.top) + 'px');
    });

    // Ripple
    button.addEventListener('click', function(e) {
      const rect = button.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.classList.add('ripple');

      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';

      button.appendChild(ripple);

      setTimeout(() => ripple.remove(), 600);
    });
  }
</script>

</head>

<body>

<!-- Background watermark logo -->
<img src="lunar.png" class="bg-logo" style="top:50%;left:50%;transform:translate(-50%,-50%);">

<div class="rain"></div>

<div class="container">
  <img src="lunar.png" alt="Lunar Logo">
  <br>
  <button onclick="openSite()">Launch Lunar In Stealth Mode</button>
</div>

</body>
</html>
