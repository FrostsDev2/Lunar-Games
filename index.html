<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3294172390463223"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="lunar.png">
  <style>
    :root {
      --primary: #a855f7;
      --accent: #6366f1;
      --tide: #38bdf8;
      --bg-dark: #030005;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at center, #0f001a 0%, #030005 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }
    /* Background visuals */
    .visuals {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .drop {
      position: absolute;
      width: 1px;
      height: 40px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(168, 85, 247, 0.4)
      );
      animation: fall linear infinite;
    }
    @keyframes fall {
      to {
        transform: translateY(100vh);
      }
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--d) infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% {
        opacity: 0.2;
        transform: scale(1);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.3);
      }
    }
    /* Main card */
    .container {
      position: relative;
      z-index: 10;
      width: min(520px, 90vw);
      text-align: center;
      padding: 45px 40px;
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
      transition: transform 0.3s ease;
    }
    .container:hover {
      transform: scale(1.01);
    }
    .logo-main {
      width: 115px;
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
      margin-bottom: 18px;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-12px) rotate(2deg);
      }
    }
    h1 {
      font-weight: 900;
      font-size: 3.5rem;
      margin: 0 0 8px 0;
      letter-spacing: -2px;
      background: linear-gradient(
        135deg,
        #fff 30%,
        var(--primary) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .subtitle {
      opacity: 0.5;
      font-weight: 400;
      margin: 0 0 30px 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.75rem;
    }
    /* Launcher choices */
    .launch-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .launch-button {
      width: 100%;
      border: none;
      padding: 18px 22px;
      font-family: 'Poppins', sans-serif;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    .launch-button:active {
      transform: scale(0.97);
    }
    /* Tide button */
    .tide-button {
      background: linear-gradient(
        135deg,
        rgba(56, 189, 248, 0.2),
        rgba(14, 165, 233, 0.08)
      );
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: white;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.08);
    }
    .tide-button:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.7);
      background: linear-gradient(
        135deg,
        rgba(56, 189, 248, 0.3),
        rgba(14, 165, 233, 0.12)
      );
      box-shadow: 0 15px 40px rgba(56, 189, 248, 0.2);
    }
    /* Lunar button */
    .lunar-button {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(168, 85, 247, 0.25);
      color: white;
    }
    .lunar-button:hover {
      transform: translateY(-3px);
      border-color: rgba(168, 85, 247, 0.6);
      background: rgba(168, 85, 247, 0.12);
      box-shadow: 0 15px 40px rgba(168, 85, 247, 0.2);
    }
    .button-title {
      display: block;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.3px;
      margin-bottom: 3px;
    }
    .button-description {
      display: block;
      font-size: 11px;
      font-weight: 400;
      opacity: 0.55;
      letter-spacing: 0.2px;
    }
    .new-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
    }
    /* Background watermark */
    .bg-logo {
      position: fixed;
      width: 70vw;
      opacity: 0.02;
      z-index: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* ---------- Modal ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(3, 0, 5, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      position: relative;
      width: min(400px, 100%);
      padding: 36px 32px 28px;
      text-align: center;
      background: linear-gradient(160deg, rgba(20, 12, 36, 0.96), rgba(8, 4, 16, 0.96));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 28px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.7),
        0 0 60px rgba(56, 189, 248, 0.08);
      transform: translateY(16px) scale(0.96);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    .modal-overlay.open .modal {
      transform: translateY(0) scale(1);
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .modal-close:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .modal-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 30px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }
    .modal h2 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .modal p {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
    }
    .modal-sign {
      display: block;
      margin-top: 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #7dd3fc;
    }
    .modal-action {
      width: 100%;
      margin-top: 24px;
      padding: 13px 20px;
      border: none;
      border-radius: 14px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: #04121c;
      background: linear-gradient(135deg, #7dd3fc, var(--tide));
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .modal-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.35);
    }
    .modal-action:active {
      transform: scale(0.98);
    }
    .modal-close:focus-visible,
    .modal-action:focus-visible,
    .launch-button:focus-visible {
      outline: 2px solid #7dd3fc;
      outline-offset: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      .modal-overlay,
      .modal {
        transition: none;
      }
    }

    /* Small screens */
    @media (max-width: 500px) {
      .container {
        padding: 35px 25px;
      }
      h1 {
        font-size: 3rem;
      }
      .logo-main {
        width: 95px;
      }
    }
  </style>
  <script>
    function openLunar() {
      const win = window.open();
      if (!win) {
        alert("Pop-up blocked! Please allow pop-ups to launch Lunar.");
        return;
      }
      const url = "https://lunarr-os.vercel.app/app.html";
      const iframe = win.document.createElement("iframe");
      win.document.title = "Lunar";
      win.document.body.style.margin = "0";
      win.document.body.style.padding = "0";
      win.document.body.style.height = "100vh";
      win.document.body.style.overflow = "hidden";
      win.document.body.style.background = "#030005";
      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.style.border = "none";
      iframe.src = url;
      win.document.body.appendChild(iframe);
    }

    let lastFocused = null;

    function openTide() {
      const overlay = document.getElementById("tideModal");
      lastFocused = document.activeElement;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.getElementById("tideModalAction").focus();
    }

    function closeTide() {
      const overlay = document.getElementById("tideModal");
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      if (lastFocused) lastFocused.focus();
    }

    document.addEventListener("keydown", function(e) {
      const overlay = document.getElementById("tideModal");
      if (!overlay.classList.contains("open")) return;
      if (e.key === "Escape") {
        closeTide();
      } else if (e.key === "Tab") {
        // Keep focus inside the modal
        const items = overlay.querySelectorAll("button");
        const first = items[0];
        const last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    });

    window.onload = function() {
      const visuals = document.querySelector(".visuals");

      /* Close modal when clicking the backdrop */
      document.getElementById("tideModal").addEventListener("click", function(e) {
        if (e.target === this) closeTide();
      });

      /* Generate Stars */
      for (let i = 0; i < 100; i++) {
        const star = document.createElement("div");
        star.className = "star";
        const size = Math.random() * 2;
        star.style.width = size + "px";
        star.style.height = size + "px";
        star.style.left = Math.random() * 100 + "vw";
        star.style.top = Math.random() * 100 + "vh";
        star.style.setProperty(
          "--d",
          (3 + Math.random() * 4) + "s"
        );
        visuals.appendChild(star);
      }
      /* Generate Rain */
      for (let i = 0; i < 60; i++) {
        const drop = document.createElement("div");
        drop.className = "drop";
        drop.style.left = Math.random() * 100 + "vw";
        drop.style.top = "-50px";
        drop.style.animationDuration =
          (0.7 + Math.random() * 0.5) + "s";
        drop.style.animationDelay =
          Math.random() * 2 + "s";
        drop.style.opacity =
          Math.random() * 0.5;
        visuals.appendChild(drop);
      }
    };
  </script>
</head>
<body>
  <img src="lunar.png" class="bg-logo" alt="">
  <div class="visuals"></div>
  <div class="container">
    <img
      src="lunar.png"
      class="logo-main"
      alt="Lunar Logo"
    >
    <h1>Lunar</h1>
    <p class="subtitle">
      Secure OS Interface
    </p>
    <div class="launch-options">
      <!-- NEW TIDE -->
      <button
        class="launch-button tide-button"
        onclick="window.open('https://mathmaticsandixl.vercel.app/', '_blank')"
      >
        <span class="new-badge">NEW</span>
        <span class="button-title">
          🌊 NEW TIDE!
        </span>
        <span class="button-description">
          Launch Update Tide Site!
        </span>
      </button>
      <!-- LUNAR -->
      <button
        class="launch-button lunar-button"
        onclick="openLunar()"
      >
        <span class="button-title">
          🌙 Launch Lunar
        </span>
        <span class="button-description">
          Continue to the Lunar OS interface
        </span>
      </button>
    </div>
  </div>

  <!-- Tide maintenance modal -->
  <div
    class="modal-overlay"
    id="tideModal"
    aria-hidden="true"
  >
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tideModalTitle"
      aria-describedby="tideModalText"
    >
      <button
        class="modal-close"
        onclick="closeTide()"
        aria-label="Close"
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M2 2l10 10M12 2L2 12"/>
        </svg>
      </button>
      <div class="modal-icon">🌊</div>
      <h2 id="tideModalTitle">NEW LINK SOON!</h2>
      <p id="tideModalText">
        The orginal link for the new Tide has already been blocked :( , New Link Soon! Check in around 11am-1pm!
      </p>
      <span class="modal-sign">Tide Staff Team</span>
      <button
        class="modal-action"
        id="tideModalAction"
        onclick="closeTide()"
      >
        Got it
      </button>
    </div>
  </div>
</body>
</html>
